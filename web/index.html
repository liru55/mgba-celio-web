<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mGBA celio Web</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-256.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#151925">
<style>
*{box-sizing:border-box}body{background:#151925;color:#edf1ff;font:15px system-ui;margin:0;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));min-height:100dvh}main{max-width:900px;margin:auto}header{display:flex;align-items:center;gap:8px;padding:12px 0}h1{font-size:17px;margin:0;margin-right:auto}button,summary{background:#303c59;color:white;border:1px solid #596b98;border-radius:12px;padding:12px;cursor:pointer;font:inherit}button:disabled{opacity:.4}button:active,.pressed{background:#526eaa}#status{margin:0 0 10px;font-size:12px;color:#bdc8e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}canvas{display:block;width:100%;image-rendering:pixelated;background:#080b12;aspect-ratio:3/2;border-radius:8px}canvas:fullscreen{width:100%;height:100%;object-fit:contain;background:black}.gamepad{padding:16px 0;max-width:560px;margin:auto}.shoulders{display:flex;justify-content:space-between;margin-bottom:12px}.shoulders button{width:78px}.primary{display:flex;justify-content:space-between;align-items:center;gap:18px}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px}.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}.dpad button{padding:0;font-size:22px}.ab{display:flex;align-items:center;gap:14px}.ab button{width:64px;height:64px;border-radius:50%;font-size:22px;font-weight:bold}.ab button:last-child{transform:translateY(-20px);background:#73559e}.system{display:flex;justify-content:center;gap:16px;margin-top:12px}.system button{min-width:88px;padding:10px;font-size:12px}.gamepad button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}details{margin:0 0 16px}summary{background:transparent;text-align:center}details .options{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}details p{color:#bdc8e1;font-size:13px;line-height:1.7}details button{flex:1;min-width:130px}.expanded details,.expanded h1{display:none}@media(min-width:700px){canvas{max-height:65dvh;object-fit:contain}.dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}}@media(orientation:landscape) and (max-height:550px){main{max-width:none}header{padding:6px 0}#status{margin-bottom:4px}.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:center}canvas{max-height:calc(100dvh - 80px);object-fit:contain}.gamepad{width:100%;padding:4px 0}.primary{gap:8px}.ab{gap:10px}.ab button{width:58px;height:58px}.shoulders{margin-bottom:6px}.system{margin-top:4px}details{margin-top:8px}}
</style></head><body><main>
<header><h1>mGBA <span style="color:#bdc8e1">celio</span></h1><button id="open" disabled>ROMを開く</button><button id="pause" disabled>一時停止</button></header>
<p id="status" role="status">WASMを読み込み中…</p>
<input id="rom" type="file" hidden><input id="save" type="file" hidden>
<div class="play"><canvas id="screen" width="240" height="160" aria-label="ゲーム画面"></canvas>
<div class="gamepad"><div class="shoulders"><button data-key="9">L</button><button data-key="8">R</button></div>
<div class="primary"><div class="dpad"><button class="up" data-key="6" aria-label="上">↑</button><button class="left" data-key="5" aria-label="左">←</button><button class="down" data-key="7" aria-label="下">↓</button><button class="right" data-key="4" aria-label="右">→</button></div><div class="ab"><button data-key="1">B</button><button data-key="0">A</button></div></div>
<div class="system"><button data-key="2">SELECT</button><button data-key="3">START</button></div></div></div>
<details><summary>セーブ・設定・使い方</summary><div class="options"><button id="export" disabled>セーブを書き出す</button><button id="import" disabled>セーブを選んで変更</button><button id="reset" disabled>リセット</button><button id="fullscreen">全画面</button></div>
<p>iPhone / iPad：Safariの共有メニュー →「ホーム画面に追加」で起動ショートカットを作成できます。</p>
<p>ROMは端末内で処理します。終了前にセーブを書き出してください。タブを閉じると未書き出しのセーブは失われます。</p>
<p>キーボード：方向キー / Z：A / X：B / A：L / S：R / Enter：START / Shift：SELECT<br>Ctrl・⌘ + O：ROM / S：セーブ書出 / R：リセット / Shift + O：セーブ読込 / Space：停止 / F：全画面</p></details>
</main><script src="mgba.js"></script><script src="app.js"></script></body></html>
