name: Native 3DS
on:
  workflow_dispatch:
  push:
    branches: [native-3ds]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-3ds -DCMAKE_TOOLCHAIN_FILE=src/platform/3ds/CMakeToolchain.txt -DCMAKE_BUILD_TYPE=Release -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_LTO=OFF
      - name: Build
        run: cmake --build build-3ds --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-celio-3ds
          path: |
            build-3ds/**/*.3dsx
            build-3ds/**/*.cia
            build-3ds/**/*.smdh
          if-no-files-found: error
