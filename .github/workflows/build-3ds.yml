name: Native 3DS
on:
  workflow_dispatch:
  push:
    branches: [native-3ds]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y g++ unzip curl
          git clone https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          git -C /tmp/bannertool checkout 734d33be79fd3f8c29c6296158f06ac7c5ca9dcb
          cmake -S /tmp/bannertool -B /tmp/bannertool-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/bannertool-build --parallel 2
          cmake --install /tmp/bannertool-build
          git clone --branch makerom-v0.19.0 --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/project-ctr
          make -C /tmp/project-ctr/makerom deps -j2
          make -C /tmp/project-ctr/makerom -j2
          install -m 755 /tmp/project-ctr/makerom/bin/makerom /usr/local/bin/makerom
      - name: Configure
        run: cmake -S . -B build-3ds -DCMAKE_TOOLCHAIN_FILE=src/platform/3ds/CMakeToolchain.txt -DCMAKE_BUILD_TYPE=Release -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_LTO=OFF
      - name: Build
        run: cmake --build build-3ds --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-celio-3ds
          path: |
            build-3ds/**/*.3dsx
            build-3ds/**/*.cia
            build-3ds/**/*.smdh
          if-no-files-found: error
